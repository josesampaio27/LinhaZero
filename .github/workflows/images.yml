name: Images

# Builds the images the cluster runs (infra/k8s) and pushes them to GitHub's registry as
# ghcr.io/<owner>/linhazero-<name>, tagged `main` and with the commit sha; then `deploy` puts them on the cluster.
# The images hold no domain: the pages work out app./account. from their own address, and the servers read it from
# the cluster's config (infra/k8s/config.env). Optional repository variable (Settings → Secrets and variables →
# Actions → Variables): IMAGE_PLATFORMS, linux/amd64 by default; "linux/amd64,linux/arm64" for ARM nodes (slower).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            file: backend/src/LinhaZero.Api/Dockerfile
          - name: ingest
            context: backend
            file: backend/src/LinhaZero.Ingest/Dockerfile
          - name: engine-worker
            context: .
            file: engine-worker/Dockerfile
          - name: web
            context: .
            file: web/Dockerfile
          - name: landing
            context: .
            file: landing/Dockerfile
          - name: keycloak
            context: infra/keycloak
            file: infra/keycloak/Dockerfile
          - name: grids
            context: .
            file: infra/grids/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          push: true
          build-args: APP_VERSION=${{ github.sha }} # only web/Dockerfile reads it
          tags: |
            ghcr.io/${{ github.repository_owner }}/linhazero-${{ matrix.name }}:main
            ghcr.io/${{ github.repository_owner }}/linhazero-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Puts this commit's images on the homelab cluster: runs on the runner inside it (infra/runner), which reaches the
  # cluster's API from within, so nothing is opened to the internet. Rollback: re-run this workflow on an older commit,
  # or `infra/k8s/deploy.sh <sha>` by hand.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: homelab
    concurrency: { group: deploy-homelab, cancel-in-progress: false }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: kubectl
        run: |
          curl -fsSLo "$RUNNER_TEMP/kubectl" https://dl.k8s.io/release/v1.36.5/bin/linux/amd64/kubectl
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: bash infra/k8s/deploy.sh "$GITHUB_SHA"
