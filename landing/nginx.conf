# Serves the built landing page. The hero grid is mounted from web/public/grids.
server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/css application/octet-stream;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /grids/ {
        add_header Cache-Control "no-cache";
    }
    # Hashed build files never change; a missing one is a 404, never index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
