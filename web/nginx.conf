# Serves the built interface. /api is routed to the API in front of this container, by the proxy (infra/Caddyfile)
# locally and by the ingress in the cluster, so the browser still sees one origin (no CORS), as with Vite.
server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/css application/octet-stream;

    # Grids are mounted from web/public/grids and can be regenerated while the stack runs.
    location /grids/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app shell and the service worker are revalidated on every load, so a deploy reaches everyone at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location /scenarios/ {
        add_header Cache-Control "no-cache";
    }
    # Hashed build files never change; a missing one is a 404, never index.html (which would be cached as JS).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Not in nginx's mime.types.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
}
