# Serves the built interface and forwards /api to the API, so the browser sees one origin (no CORS), as with Vite.
server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/css application/octet-stream;

    # Docker's DNS, looked up per request: nginx starts even if the API is not up yet, and follows --scale api=N.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Run progress is streamed with SSE (runs/{id}/events): no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Grids are mounted from web/public/grids and can be regenerated while the stack runs.
    location /grids/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app shell and the service worker are revalidated on every load, so a deploy reaches everyone at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location /scenarios/ {
        add_header Cache-Control "no-cache";
    }
    # Hashed build files never change; a missing one is a 404, never index.html (which would be cached as JS).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Not in nginx's mime.types.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
}
