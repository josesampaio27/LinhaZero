# The API: REST + SSE on app.<domain>/api, and the login (the OIDC client of Keycloak). No state of its own: the
# session keys are in Postgres, so it scales.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      initContainers:
        - name: grids
          image: linhazero-grids
          imagePullPolicy: IfNotPresent
          command: ["cp", "-r", "/grids/.", "/out/"]
          volumeMounts:
            - { name: grids, mountPath: /out }
      containers:
        - name: api
          image: linhazero-api
          imagePullPolicy: IfNotPresent
          env:
            - name: LZ_DOMAIN
              valueFrom: { configMapKeyRef: { name: linhazero-config, key: LZ_DOMAIN } }
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: dois }
            - { name: PGDATABASE, value: dois }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: linhazero-secrets, key: POSTGRES_PASSWORD } }
            - { name: NATS_URL, value: "nats://nats:4222" }
            - { name: GRIDS_DIR, value: /grids }
            - { name: OIDC_AUTHORITY, value: "https://account.$(LZ_DOMAIN)/realms/linhazero" }
            - { name: OIDC_METADATA_ADDRESS, value: "http://keycloak:8080/realms/linhazero/.well-known/openid-configuration" }
            - { name: OIDC_CLIENT_ID, value: linhazero-app }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: linhazero-secrets, key: OIDC_CLIENT_SECRET } }
            - { name: LANDING_URL, value: "https://$(LZ_DOMAIN)/" }
            - { name: APP_URL, value: "https://app.$(LZ_DOMAIN)/" }
            # "Pedir acesso": the landing's origins, and the API's own Keycloak client that creates approved accounts.
            - { name: CORS_ORIGINS, value: "https://landing.$(LZ_DOMAIN),https://$(LZ_DOMAIN)" }
            - { name: KEYCLOAK_URL, value: "http://keycloak:8080" }
            - { name: KEYCLOAK_ADMIN_CLIENT_ID, value: linhazero-api-admin }
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: linhazero-secrets, key: KEYCLOAK_ADMIN_CLIENT_SECRET } }
            # Each access request emails every admin (docs/decisoes/0067), through the same SMTP relay as Keycloak, at most
            # ACCESS_REQUEST_EMAILS_PER_DAY emails a day (Brevo allows 300, shared with Keycloak's invites and resets).
            - name: SMTP_HOST
              valueFrom: { configMapKeyRef: { name: linhazero-config, key: SMTP_HOST } }
            - name: SMTP_PORT
              valueFrom: { configMapKeyRef: { name: linhazero-config, key: SMTP_PORT } }
            - name: SMTP_FROM
              valueFrom: { configMapKeyRef: { name: linhazero-config, key: SMTP_FROM } }
            - name: SMTP_USER
              valueFrom: { configMapKeyRef: { name: linhazero-config, key: SMTP_USER } }
            - name: SMTP_AUTH
              valueFrom: { configMapKeyRef: { name: linhazero-config, key: SMTP_AUTH } }
            - name: SMTP_STARTTLS
              valueFrom: { configMapKeyRef: { name: linhazero-config, key: SMTP_STARTTLS } }
            - name: SMTP_SSL
              valueFrom: { configMapKeyRef: { name: linhazero-config, key: SMTP_SSL } }
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: linhazero-secrets, key: SMTP_PASSWORD } }
            - { name: ACCESS_REQUEST_EMAILS_PER_DAY, value: "100" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: grids, mountPath: /grids, readOnly: true }
      volumes:
        - { name: grids, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 8080, targetPort: http }
