# Cloudflare Tunnel: dials out to Cloudflare, so no port is opened on the home network. The routes (which host and path
# go to which service) are set on the tunnel in the Cloudflare dashboard (infra/k8s/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: linhazero-secrets, key: TUNNEL_TOKEN } }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
